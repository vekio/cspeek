name: prod
variables:
  - name: base_url
    value: https://api.liquipedia.net/api/v3/
    description: Liquipedia API base URL, including the trailing slash.
  - name: wiki
    value: counterstrike
    description: Liquipedia wiki to query.
  - name: game
    value: cs2
    description: Match game identifier.
  - name: tier
    value: curated
    description: curated, S, A, B, C, or empty for all tiers.
  - name: limit
    value: "100"
    description: Page size from 1 to 1000.
  - name: offset
    value: "0"
    description: Number of API records to skip.
  - secret: true
    name: api_key
    description: API key without the Apikey prefix.
  - name: include_qualifiers
    value: "false"
    description: Include qualifier events from the selected tier.
