info:
  name: Upcoming
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}match?wiki={{wiki}}&conditions={{upcoming_conditions}}&query={{match_fields}}&order=date ASC,objectname ASC&limit={{limit}}&offset={{offset}}&rawstreams=false&streamurls=false"
  headers:
    - name: accept
      value: application/json
      description: Request a JSON response.
    - name: Accept-Encoding
      value: gzip
      description: Enable the compression required by Liquipedia.
  params:
    - name: wiki
      value: "{{wiki}}"
      type: query
      description: Liquipedia wiki to query.
    - name: conditions
      value: "{{upcoming_conditions}}"
      type: query
      description: Upcoming match conditions generated before each request.
    - name: query
      value: "{{match_fields}}"
      type: query
      description: Fields needed to inspect and display a match.
    - name: order
      value: date ASC,objectname ASC
      type: query
      description: Sort by start time, then by stable record name.
    - name: limit
      value: "{{limit}}"
      type: query
      description: Page size from 1 to 1000.
    - name: offset
      value: "{{offset}}"
      type: query
      description: Number of API records to skip.
    - name: rawstreams
      value: "false"
      type: query
      description: Keep normalized Liquipedia stream names.
    - name: streamurls
      value: "false"
      type: query
      description: Return stream names instead of resolved URLs.
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const game = bru.getEnvVar("game");
        const tier = String(bru.getEnvVar("tier") ?? "curated").trim().toLowerCase();
        // Letter labels map to the numeric tier values stored by Liquipedia.
        const tierValues = {s: "1", a: "2", b: "3", c: "4"};
        if (tier && tier !== "curated" && !tierValues[tier]) {
          throw new Error("tier must be curated, S, A, B, C, or empty for all tiers");
        }
        // No date condition keeps started and scheduled matches in one list.
        const conditions = [
          `[[game::${game}]]`,
          "[[finished::0]]",
          "[[dateexact::1]]"
        ];
        // Liquipedia stores the featured boolean as 1 in query conditions.
        if (tier === "curated") {
          conditions.push("[[extradata_featured::1]]");
        } else if (tier) {
          conditions.push(`[[liquipediatier::${tierValues[tier]}]]`);
        }
        const includeQualifiers = String(bru.getEnvVar("include_qualifiers") ?? "false").trim().toLowerCase();
        if (!["true", "false"].includes(includeQualifiers)) {
          throw new Error("include_qualifiers must be true or false");
        }
        // A qualifier can share its parent event's tier, so filter its type separately.
        if (includeQualifiers === "false") {
          conditions.push("[[liquipediatiertype::!Qualifier]]");
        }
        bru.setVar("upcoming_conditions", conditions.join(" AND "));
        bru.setVar("match_fields", [
          "objectname", "match2id", "pagename", "game", "date", "dateexact",
          "finished", "status", "winner", "walkover", "resulttype", "bestof",
          "tournament", "tickername", "liquipediatier", "liquipediatiertype", "section", "extradata",
          "match2opponents", "match2games", "stream", "links"
        ].join(","));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns unfinished matches with an exact scheduled start. No date condition is
  applied, so the result contains both started and future matches.
