opencollection: 1.0.0

info:
  name: Liquipedia
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: apikey
    key: authorization
    value: Apikey {{api_key}}
    placement: header
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
